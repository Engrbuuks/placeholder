# Free backup trigger for the scheduler: calls the tick every 5 minutes from GitHub.
# Set two repository secrets: APP_URL (for example https://yourapp.vercel.app) and CRON_SECRET.
# GitHub may delay scheduled runs at busy times; the minute trigger described in the README is faster.
name: Scheduler tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due automation steps
        run: |
          curl --fail --silent --show-error --max-time 70 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/tick"
