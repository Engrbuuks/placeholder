# Publishes the landing page to GitHub Pages every time you push to main, at
# https://<owner>.github.io/<repo>/. Uses a few free GitHub minutes per push.
#
# One time setup: Settings, then Pages, then under "Build and deployment" set Source to "GitHub Actions".
# Optional: when the app is live, add a repository variable APP_URL (Settings, then Secrets and variables,
# then Actions, then Variables), for example https://app.yourdomain.com. The sign up and log in buttons
# then open the app. Until it is set, they lead to the sample check on the page.
name: Landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start it and export the landing page
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          LIVE_APP_URL: ${{ vars.APP_URL }}
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public config .next/standalone/
          # The landing page reads no data, so the app starts without a database for this.
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 APP_URL="$PAGES_URL" DATABASE_URL=postgres://unused@127.0.0.1:1/none node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          node scripts/export_landing.mjs http://127.0.0.1:3000 site "$PAGES_URL" "$LIVE_APP_URL" || { cat server.log; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
