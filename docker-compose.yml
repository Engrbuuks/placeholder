# The whole platform on one server: database, migrations, app, the every minute worker, HTTPS and daily backups.
# Start or update with:  docker compose up -d --build
# Every value comes from .env next to this file (deploy/install.sh writes it).

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://placeholder_app:${APP_DB_PASSWORD}@db:5432/placeholder
    MIGRATION_DATABASE_URL: postgres://placeholder_owner:${DB_OWNER_PASSWORD}@db:5432/placeholder
    APP_DB_ROLE: placeholder_app
    DATABASE_SSL: "false"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: placeholder_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: placeholder
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placeholder_owner -d placeholder"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app-env
    build:
      context: .
      target: tools
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: placeholder-tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-env
    build:
      context: .
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: placeholder-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: placeholder-app
    pull_policy: never
    restart: unless-stopped
    command: ["node", "deploy/worker.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      TICK_URL: http://app:3000/api/cron/tick
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    entrypoint: ["sh", "/deploy/backup.sh"]
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
